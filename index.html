<!doctype html>
<html lang="en" data-theme="light" data-segment="retail">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Meridian Banking</title>
    <script>
      // Runs before first paint so a returning user never sees the wrong
      // theme flash. Keys match src/features/preferences/usePreference.ts.
      ;(function () {
        var root = document.documentElement
        var theme = null
        var segment = null
        try {
          theme = localStorage.getItem('meridian.theme')
          segment = localStorage.getItem('meridian.segment')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        root.dataset.theme = theme
        root.dataset.segment = segment === 'premium' ? 'premium' : 'retail'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
